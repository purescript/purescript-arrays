package:
  name: arrays
  description: Utility functions for the Array type - JavaScript's native arrays.
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 7.3.1
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-arrays
  dependencies:
    - bifunctors: ">=6.0.0 <7.0.0"
    - control: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - nonempty: ">=7.0.0 <8.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - safe-coerce: ">=2.0.0 <3.0.0"
    - st: ">=6.2.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - const: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - orders: ">=6.0.0 <7.0.0"
workspace: {}
